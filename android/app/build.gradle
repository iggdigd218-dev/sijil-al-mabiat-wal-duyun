plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.nexora.eradata"
    compileSdk = 36
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17
    }

    defaultConfig {
        applicationId = "com.nexora.eradata"
        minSdk = 24
        targetSdk = 34
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        multiDexEnabled = true
    }

    // ===== تقليل حجم APK: تقسيم حسب معمارية المعالج =====
    // سينتج ملف مستقل لكل معمارية بدل ملف واحد ضخم يحتوي كل المعماريات.
    // الهواتف الحديثة غالباً arm64-v8a، لذا سيكون ملفها الأصغر (~22-28 ميجا)
    splits {
        abi {
            enable true
            reset()
            include "armeabi-v7a", "arm64-v8a", "x86_64"
            universalApk true   // يُبقي أيضاً على نسخة موحّدة لمن يحتاجها
        }
    }

    // خريطة إصدارات ABI لزيادة versionCode لكل معمارية (مطلوب عند split)
    def abiVersionCodes = [
        "armeabi-v7a": 1,
        "arm64-v8a": 2,
        "x86_64": 4,
    ]

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                keyAlias = keystoreProperties['keyAlias']
                keyPassword = keystoreProperties['keyPassword']
                storeFile = file(keystoreProperties['storeFile'])
                storePassword = keystoreProperties['storePassword']
            }
        }
    }

    buildTypes {
        release {
            signingConfig = keystorePropertiesFile.exists() ? signingConfigs.release : signingConfigs.debug
            // ===== تفعيل تصغير/تشويش الشيفرة والموارد =====
            // هذا يحذف الشيفرة غير المستخدمة ويضغط الموارد فيقلل الحجم بنسبة 30-50%
            minifyEnabled true
            shrinkResources true
            zipAlignEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                          'proguard-rules.pro'
        }
    }

    // ===== استبعاد ملفات META-INF والملفات غير الضرورية =====
    packaging {
        jniLibs {
            useLegacyPackaging = false
        }
        resources {
            excludes += [
                "META-INF/*.kotlin_module",
                "META-INF/AL2.0",
                "META-INF/LGPL2.1",
                "META-INF/*.version",
                "META-INF/LICENSE*",
                "META-INF/DEPENDENCIES*",
                "META-INF/NOTICE*",
                "/okhttp3/internal/publicsuffix/*",
                "/kotlin/**",
                "DebugProbesKt.bin",
                "*.pro",
            ]
        }
    }

    // تطبيق versionCode مختلف لكل ABI
    applicationVariants.all { variant ->
        variant.outputs.each { output ->
            def abi = output.getFilter(com.android.build.OutputFile.ABI)
            if (abi != null) {
                output.versionCodeOverride =
                    (abiVersionCodes.get(abi, 0) * 1000000) + android.defaultConfig.versionCode
            }
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    implementation "com.google.android.material:material:1.12.0"
}
