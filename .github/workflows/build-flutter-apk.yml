name: Build Flutter Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Flutter Release APK (arm64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Decode release keystore & create signing config
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeType=PKCS12
          EOF
          echo "تم تجهيز مفتاح التوقيع الثابت"

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Static analysis (blocking)
        run: flutter analyze --no-pub

      - name: Tests including release blockers (blocking)
        run: flutter test --no-pub --concurrency=1

      - name: Build Android APK (arm64 — ملف واحد)
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g"
          JAVA_OPTS: "-Xmx3g"
        run: |
          flutter build apk --release --target-platform android-arm64
          cp build/app/outputs/flutter-apk/app-release.apk nexora-arm64.apk
          ls -lh nexora-arm64.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexora-flutter-arm64
          path: nexora-arm64.apk
          retention-days: 30

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: flutter-v3.7.${{ github.run_number }}
          name: Nexora Flutter Native v3.7 (arm64)
          body: |
            ## 📱 تطبيق الأندرويد الأصلي — نسخة 64 بت (arm64)
            - **الملف**: `nexora-arm64.apk` — ملف واحد يعمل على أغلب الأجهزة الحديثة.
            - موقّع بمفتاح release ثابت؛ التحديثات القادمة تُثبَّت فوقه مباشرةً بدون حذف.
            - حجم صغير (~16MB) بعد حصر المعمارية وضغط المكتبات وإزالة الحزم غير المستخدمة.
            - يتضمن كامل إعدادات النسخة الخفيفة (نوع الواتساب، العملية الافتراضية، ملاحظات السند، تنبيه المخزون).
            - تاريخ الإصدار: ${{ github.event.head_commit.timestamp }}
          files: nexora-arm64.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate update manifest (version.json)
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          RAW=$(grep -E '^version:' pubspec.yaml | awk '{print $2}')
          VER=${RAW%%+*}
          BUILD=${RAW##*+}
          BASE=https://github.com/${GITHUB_REPOSITORY}/releases/download/latest
          # minSupported يُقرأ من ملف اختياري، وإلا فلا تحديث إجباري.
          MIN=$(cat .github/min_supported_version 2>/dev/null | tr -d '[:space:]' || true)
          MIN=${MIN:-0.0.0}
          cat > version.json <<EOF
          {
            "version": "${VER}+${BUILD}",
            "minSupported": "${MIN}",
            "releaseUrl": "https://github.com/${GITHUB_REPOSITORY}/releases/tag/latest",
            "downloads": {
              "android": "${BASE}/nexora-arm64.apk",
              "windows": "${BASE}/nexora-windows.zip"
            },
            "publishedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "notes": "إصدار ${VER} (بناء ${BUILD}) — تحسينات وإصلاحات."
          }
          EOF
          cat version.json
          python3 -c "import json;json.load(open('version.json'))"
          echo "تم توليد بيان التحديث بنجاح"

      - name: Update unified latest release (APK)
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: latest
          name: Nexora — الإصدار الرسمي الأحدث
          body: |
            ## 📥 التحميل المباشر

            **هذا هو الإصدار الرسمي الأحدث من التطبيق.**

            ### 📱 للأندرويد (APK arm64)
            - حمّل الملف `nexora-arm64.apk` بالأسفل وثبّته على جهازك.
            - يعمل على أجهزة أندرويد الحديثة (معمارية 64 بت).

            ### 🖥️ لويندوز
            - يُرفع ملف الويندوز تلقائيًا هنا بعد انتهاء بناء ويندوز (قد يتأخر بضع دقائق بعد رفع الأندرويد).
            - فك ضغط الملف ثم شغّل `nexora.exe`.

            > يتم تحديث هذه الصفحة تلقائيًا بعد كل بناء ناجح.
          files: |
            nexora-arm64.apk
            version.json
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
