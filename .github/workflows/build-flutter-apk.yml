name: Build Flutter Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Flutter Release APK (arm64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.x'
          channel: stable
          cache: true

      - name: Decode release keystore & create signing config
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeType=PKCS12
          EOF
          echo "تم تجهيز مفتاح التوقيع الثابت"

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Build Android APK (arm64 — ملف واحد)
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g"
          JAVA_OPTS: "-Xmx3g"
        run: |
          flutter build apk --release --target-platform android-arm64
          cp build/app/outputs/flutter-apk/app-release.apk nexora-arm64.apk
          ls -lh nexora-arm64.apk

      - name: Generate version manifest (version.json)
        run: |
          VER=$(grep -E '^version:' pubspec.yaml | awk '{print $2}')
          NAME="${VER%%+*}"; BUILD="${VER##*+}"
          echo "إصدار البناء: $NAME (build $BUILD)"
          cat > version.json <<EOF
          {
            "version": "$NAME+$BUILD",
            "minSupported": "3.13.0",
            "releaseUrl": "https://github.com/${{ github.repository }}/releases/tag/latest",
            "downloads": {
              "android": "https://github.com/${{ github.repository }}/releases/download/latest/nexora-arm64.apk",
              "windows": "https://github.com/${{ github.repository }}/releases/download/latest/nexora-windows.zip"
            },
            "publishedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "notes": "الجديد: مزامنة تلقائية فورية بنظام حضور ذكي — الأجهزة تكتشف بعضها خلال ثوانٍ، لا محاولات فاشلة عند غياب جهاز، ومزامنة لحظية فور عودته. دعم 5+ أجهزة مع شارة عدد الأجهزة المستلمة لكل عملية و✅ عند اكتمالها. تصميم جديد كلياً للسند (ترويسة خضراء، كبسولة المبلغ، جدول أصناف، الرصيد بعد العملية). أصوات مميزة لكل تفاعل مع معاينة في الإعدادات، اهتزاز 1.5 ثانية عند إنشاء عملية، إشعارات خارجية بصوت خاص، نوافذ إشعارات داخلية أنيقة، وتحيات صباحية ومسائية."
          }
          EOF
          cat version.json

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexora-flutter-arm64
          path: nexora-arm64.apk
          retention-days: 30

      - name: Preserve other-platform assets (windows)
        if: github.ref == 'refs/heads/main'
        run: |
          # لا نحذف ملف ويندوز الموجود مسبقًا: ننزّله ليعاد رفعه مع ملفات الأندرويد.
          for f in nexora-windows.zip; do
            code=$(curl -sL -o "$f" -w "%{http_code}" \
              "https://github.com/${{ github.repository }}/releases/download/latest/$f" || true)
            if [ "$code" != "200" ]; then echo "لا يوجد $f بعد — سيتخطاه الرفع"; rm -f "$f"; fi
          done
          ls -lh nexora-windows.zip 2>/dev/null || true

      - name: Update unified latest release (APK + version.json)
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: latest
          name: Nexora — الإصدار الرسمي الأحدث
          body: |
            ## 📥 التحميل المباشر

            **هذا هو الإصدار الرسمي الأحدث من التطبيق.**

            ### 📱 للأندرويد (APK arm64)
            - حمّل الملف `nexora-arm64.apk` بالأسفل وثبّته على جهازك.
            - يعمل على أجهزة أندرويد الحديثة (معمارية 64 بت).

            ### 🖥️ لويندوز
            - يُرفع ملف الويندوز تلقائيًا هنا بعد انتهاء بناء ويندوز (قد يتأخر بضع دقائق بعد رفع الأندرويد).
            - فك ضغط الملف ثم شغّل `nexora.exe`.

            > يتم تحديث هذه الصفحة تلقائيًا بعد كل بناء ناجح.
          files: |
            nexora-arm64.apk
            version.json
            nexora-windows.zip
          fail_on_unmatched_files: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
