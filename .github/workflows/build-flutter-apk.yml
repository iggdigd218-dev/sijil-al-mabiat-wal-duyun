name: Build Flutter Android APK

on:
  push:
    branches: [ flutter-native ]
  pull_request:
    branches: [ flutter-native ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Flutter Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.x'
          channel: 'stable'
          cache: true

      - name: Decode release keystore & create signing config
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeType=PKCS12
          EOF
          echo "تم تجهيز مفتاح التوقيع الثابت ✓"

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Build Android APK
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g"
          # إتاحة ذاكرة كافية لـ Gradle/Kotlin لتفادي GC thrashing
          JAVA_OPTS: "-Xmx3g"
        run: flutter build apk --release --no-shrink

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexora-flutter-native-v3.4.0
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/flutter-native'
        with:
          tag_name: flutter-v3.4.${{ github.run_number }}
          name: Nexora Flutter Native v3.4.${{ github.run_number }}
          body: |
            ## 📱 إطلاق تطبيق الأندرويد الأصلي Nexora Flutter Native
            تم بناء التطبيق الأصلي بنجاح وهو متاح للتنزيل المباشر والتثبيت الفوري:
            - **الملف المرفق**: `app-release.apk`
            - **الفرع**: `flutter-native`
            - تاريخ الإصدار: ${{ github.event.head_commit.timestamp }}
          files: build/app/outputs/flutter-apk/app-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
