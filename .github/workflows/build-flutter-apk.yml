name: Build Flutter Android APK

on:
  push:
    branches: [ flutter-native ]
  pull_request:
    branches: [ flutter-native ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Flutter Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.x'
          channel: 'stable'
          cache: true

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Build Android APK (split per ABI — ملف أصغر لكل معمارية)
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g"
          # إتاحة ذاكرة كافية لـ Gradle/Kotlin لتفادي GC thrashing
          JAVA_OPTS: "-Xmx3g"
        run: |
          flutter build apk --release --split-per-abi
          # أسماء واضحة للملفين
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk nexora-arm64.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk nexora-arm32.apk
          ls -lh nexora-*.apk

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nexora-flutter-native-split
          path: |
            nexora-arm64.apk
            nexora-arm32.apk
          retention-days: 30

      - name: Create GitHub Release with APKs
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/flutter-native'
        with:
          tag_name: flutter-v3.5.${{ github.run_number }}
          name: Nexora Flutter Native v3.5.${{ github.run_number }}
          body: |
            ## 📱 تطبيق الأندرويد الأصلي — نسخة مخفّفة (ملفات صغيرة حسب المعمارية)
            حمّل الملف المناسب لجهازك:
            - **`nexora-arm64.apk`** ← لمعظم الأجهزة الحديثة (موصى به).
            - **`nexora-arm32.apk`** ← للأجهزة القديمة (32 بت).
            > إن لم تعرف أيّهما يناسب جهازك، جرّب arm64 أولًا؛ فإن رفض التثبيت فاستخدم arm32.

            تحسينات هذه النسخة: تقسيم المعماريات + ضغط المكتبات + إزالة حزم غير مستخدمة، فانخفض حجم التنزيل كثيرًا مع بقاء كل المزايا والبيانات كما هي.
            - **الفرع**: `flutter-native`
            - تاريخ الإصدار: ${{ github.event.head_commit.timestamp }}
          files: |
            nexora-arm64.apk
            nexora-arm32.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
