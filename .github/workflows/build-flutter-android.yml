name: Build & Release Nexora APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Optimized Release APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Flutter (latest stable)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build optimized release APKs (split per ABI + R8 + shrinkResources)
        run: flutter build apk --release --split-per-abi --android-skip-build-dependency-validation

      - name: List built APKs
        run: ls -lh build/app/outputs/flutter-apk/

      - name: Upload all APKs as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexora-apks-${{ github.sha }}
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release with APKs attached
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Nexora Build #${{ github.run_number }} (optimized)
          body: |
            ## ✅ تم بناء التطبيق بنجاح بعد التحسين

            - **الفرع**: `${{ github.ref_name }}`
            - **Commit**: `${{ github.sha }}`
            - **نوع البناء**: Release مع تصغير الشيفرة (R8) + تصغير الموارد + تقسيم حسب المعمارية

            ### 📦 الملفات المرفقة:
            - `app-arm64-v8a-release.apk` → لهواتف 64-بت (معظم الهواتف الحديثة) — **الأصغر حجماً**
            - `app-armeabi-v7a-release.apk` → لهواتف 32-بت القديمة
            - `app-x86_64-release.apk` → للمحاكيات
            - `app-universal-release.apk` → النسخة الموحّدة لكل المعماريات (أكبر حجماً)

            ### 💡 للتثبيت على هاتفك:
            قم بتحميل ملف `app-arm64-v8a-release.apk` فهو الأكثر احتمالاً أن يعمل على هاتفك.
          files: build/app/outputs/flutter-apk/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
