name: Build Nexora Release (APK arm64)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK arm64
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build Release APK (arm64-v8a)
        run: |
          flutter build apk --release --target-platform android-arm64 --android-skip-build-dependency-validation
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/nexora-arm64.apk
          ls -lh dist/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nexora-arm64
          path: dist/nexora-arm64.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: flutter-v3.8.${{ github.run_number }}
          name: Nexora Flutter Native v3.8 (nexora-arm64.apk)
          body: |
            ## ✅ تم بناء التطبيق بنجاح على GitHub Actions

            - **Commit**: `${{ github.sha }}`
            - **نوع البناء**: Release (R8 مضغوط، arm64-v8a فقط)

            ### 📱 التحميل:
            - **`nexora-arm64.apk`** — يعمل على جميع هواتف أندرويد الحديثة (64 بت)

            ⚠️ قم بحذف النسخة القديمة أولاً قبل تثبيت هذه المرة (مفتاح التوقيع سيتغير).
          files: dist/nexora-arm64.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
