name: Build Nexora Release (APK + Windows)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build APK arm64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '21' }
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - name: Deps
        run: flutter pub get
      - name: Build APK
        run: |
          flutter build apk --release --target-platform android-arm64 --android-skip-build-dependency-validation
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/nexora-arm64.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with: { name: nexora-apk, path: dist/nexora-arm64.apk, retention-days: 30 }
      - name: Upload APK to release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: flutter-v3.8.${{ github.run_number }}
          name: Nexora Flutter Native v3.8 (APK + Windows)
          body: |
            ## ✅ تم بناء التطبيق بنجاح — أندرويد + ويندوز

            - **Commit**: `${{ github.sha }}`
            - **نوع البناء**: Release (R8 مضغوط)

            ### 📱 للأندرويد (جميع الهواتف الحديثة):
            - `nexora-arm64.apk` (64 بت)

            ### 💻 للكمبيوتر ويندوز:
            - `nexora-windows.zip` — فك الضغط ثم شغّل `nexora_app.exe`

            ⚠️ قم بحذف النسخة القديمة أولاً قبل التثبيت هذه المرة.
          files: dist/nexora-arm64.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-win:
    name: Build Windows
    needs: build-apk
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - name: Enable Windows + deps
        run: |
          flutter config --enable-windows-desktop
          flutter pub get
          if (-not (Test-Path windows)) { flutter create . --platforms=windows }
          flutter pub get
      - name: Build Windows
        run: |
          flutter build windows --release
          mkdir dist -Force | Out-Null
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath dist\nexora-windows.zip -Force
          Get-ChildItem dist | Format-Table Name,Length
      - name: Upload Windows to release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: flutter-v3.8.${{ github.run_number }}
          files: dist/nexora-windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
