name: Build Nexora Release (APK)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK arm64 + Linux bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install deps + enable Linux desktop
        run: |
          flutter config --enable-linux-desktop
          flutter pub get

      - name: Build Release APK (arm64)
        run: |
          flutter build apk --release --target-platform android-arm64 --android-skip-build-dependency-validation
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/nexora-arm64.apk

      - name: Build Linux bundle (runnable on Linux / Steam Deck / WSL)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
          flutter build linux --release
          cd build/linux/x64/release
          tar -czf /home/runner/work/sijil-al-mabiat-wal-duyun/sijil-al-mabiat-wal-duyun/dist/nexora-linux.tar.gz .

      - name: Show outputs
        run: ls -lh dist/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nexora-release
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: flutter-v3.8.${{ github.run_number }}
          name: Nexora Flutter Native v3.8 (nexora-arm64.apk)
          body: |
            ## ✅ تم بناء التطبيق بنجاح

            - **Commit**: `${{ github.sha }}`
            - **نوع البناء**: Release (R8 مضغوط، arm64-v8a)

            ### 📱 للأندرويد (جميع الهواتف الحديثة):
            - **`nexora-arm64.apk`** — الملف المطلوب (حوالي 23-24 ميجا)

            ### 💻 نسخة لنظام لينكس (تشغيل مباشر):
            - `nexora-linux.tar.gz` — فك الضغط وشغّل `nexora_app`

            ⚠️ قم بحذف النسخة القديمة أولاً قبل تثبيت هذه المرة.
          files: |
            dist/nexora-arm64.apk
            dist/nexora-linux.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
