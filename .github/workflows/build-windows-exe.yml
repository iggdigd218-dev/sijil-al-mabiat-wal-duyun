name: Build Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Windows Desktop
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Generate fresh Windows platform (match installed Visual Studio)
        run: |
          Remove-Item -Recurse -Force windows -ErrorAction SilentlyContinue
          flutter create --platforms=windows --project-name nexora_app .

      - name: Static analysis (blocking)
        run: flutter analyze --no-pub

      - name: Tests including release blockers (blocking)
        run: flutter test --no-pub --concurrency=1

      - name: Diagnose toolchain
        run: |
          flutter doctor -v
          & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -all -property installationPath
          echo "---"
          cmake --version

      - name: Build Windows Release
        env:
          # إضافة local_auth_windows تُترجم بـ /await القديم (STL1011 خطأ في VS 2026).
          # لا نستخدم البصمة على ويندوز؛ نكتم التحذير القاتل حتى تُترجم الإضافة.
          CL: "/D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS"
        run: |
          flutter clean
          flutter pub get
          flutter build windows --release

      - name: Package ZIP
        shell: pwsh
        run: |
          $src = "build\windows\x64\runner\Release"
          $zip = "nexora-windows-v${{ github.run_number }}.zip"
          Compress-Archive -Path "$src\*" -DestinationPath $zip
          echo "ZIP=$zip" >> $env:GITHUB_ENV

      - name: Upload EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexora-windows
          path: build/windows/x64/runner/Release/*
          retention-days: 30

      - name: Create Windows Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: windows-v1.0.${{ github.run_number }}
          name: إصدار ويندوز (Nexora Windows v1.0.${{ github.run_number }})
          body: |
            ## 🖥️ نسخة ويندوز الأصلية
            برنامج سطح مكتب ويندوز (نسخة مطبوعة جاهزة).
            **طريقة التشغيل:** حمّل ملف ZIP، استخرج محتواه في مجلد، ثم شغّل `nexora_app.exe`.
            تاريخ البناء: ${{ github.event.head_commit.timestamp }}
          files: ${{ env.ZIP }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update unified latest release (Windows)
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: latest
          name: Nexora — الإصدار الرسمي الأحدث
          body: |
            ## 📥 التحميل المباشر

            **هذا هو الإصدار الرسمي الأحدث من التطبيق.**

            ### 🖥️ لويندوز
            - حمّل ملف `nexora-windows-v${{ github.run_number }}.zip` بالأسفل.
            - فك الضغط في أي مجلد ثم شغّل `nexora_app.exe`.

            ### 📱 للأندرويد (APK)
            - يُرفع ملف الأندرويد تلقائيًا هنا بعد انتهاء بناء APK (قد يتأخر بضع دقائق).
            - ثبّت `nexora-arm64.apk` على الجهاز.

            > يتم تحديث هذه الصفحة تلقائيًا بعد كل بناء ناجح.
          files: ${{ env.ZIP }}
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
