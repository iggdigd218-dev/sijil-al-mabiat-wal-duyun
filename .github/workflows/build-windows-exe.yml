name: Build Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Windows Desktop
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Generate fresh Windows platform (match installed Visual Studio)
        run: |
          Remove-Item -Recurse -Force windows -ErrorAction SilentlyContinue
          flutter create --platforms=windows --project-name nexora_app .

      - name: Analyze (non-blocking)
        run: flutter analyze || true

      - name: Diagnose toolchain
        run: |
          flutter doctor -v
          & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -all -property installationPath
          echo "---"
          cmake --version

      - name: Build Windows Release
        env:
          # إضافة local_auth_windows تُترجم بـ /await القديم (STL1011 خطأ في VS 2026).
          # لا نستخدم البصمة على ويندوز؛ نكتم التحذير القاتل حتى تُترجم الإضافة.
          CL: "/D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS"
        run: |
          flutter clean
          flutter pub get
          flutter build windows --release

      - name: Package portable app (folder + EXE + launcher)
        shell: pwsh
        run: |
          $rel = "build\windows\x64\runner\Release"
          $pkg = "nexora-windows\App"
          New-Item -ItemType Directory -Force -Path $pkg | Out-Null
          Copy-Item -Path "$rel\*" -Destination $pkg -Recurse -Force
          # ملف تشغيل في الجذر يتتبع المسار تلقائيًا (مسار ASCII للتوافق).
          $bat = @(
            "@echo off",
            "cd /d `"%~dp0App`"",
            "start `"`" `"nexora_app.exe`"",
            "exit"
          )
          Set-Content -Path "nexora-windows\Run.bat" -Value $bat -Encoding ASCII
          # انسخ الملف العربي داخل مجلد التطبيق كاختصار إضافي.
          Set-Content -Path "nexora-windows\App\Run.bat" -Value $bat -Encoding ASCII
          $readme = "مدير الحسابات (Nexora) - Windows portable`r`n`r`nHOW TO RUN:`r`n1) Extract this whole zip to a folder (keep all files together).`r`n2) Double-click Run.bat  OR open the App folder and run nexora_app.exe.`r`n`r`nIMPORTANT: Do NOT move nexora_app.exe out of the App folder; it needs the data folder and DLLs next to it.`r`nOn first run Windows SmartScreen may warn: click (More info) then (Run anyway)."
          Set-Content -Path "nexora-windows\README.txt" -Value $readme -Encoding UTF8
          Get-ChildItem $pkg | Select-Object -ExpandProperty Name

      - name: Package ZIP
        shell: pwsh
        run: |
          $zip = "nexora-windows.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path "nexora-windows\*" -DestinationPath $zip -Force
          echo "ZIP=$zip" >> $env:GITHUB_ENV

      - name: Build MSIX installer (true installed app)
        shell: pwsh
        run: |
          $rel = "build\windows\x64\runner\Release"
          # هيّئ محتوى الحزمة: مجلد التطبيق الجاهز كمحتوى رئيسي للحزمة.
          $staging = "msix-pkg"
          Remove-Item -Recurse -Force $staging -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path "$staging\app" | Out-Null
          New-Item -ItemType Directory -Force -Path "$staging\Assets" | Out-Null
          Copy-Item -Path "$rel\*" -Destination "$staging\app" -Recurse -Force
          # ولّد شعار PNG صالحًا بسيطًا (مربع ملوّن) لاجتياز makeappx.
          Add-Type -AssemblyName System.Drawing
          function New-Logo($path,$size){
            $bmp = New-Object System.Drawing.Bitmap($size,$size)
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.Clear([System.Drawing.Color]::FromArgb(15,118,110))
            $f = New-Object System.Drawing.Font("Arial",($size/2),[System.Drawing.FontStyle]::Bold)
            $br = [System.Drawing.Brushes]::White
            $sf = New-Object System.Drawing.StringFormat; $sf.Alignment="Center"; $sf.LineAlignment="Center"
            $g.DrawString("م",$f,$br,(New-Object System.Drawing.RectangleF(0,0,$size,$size)),$sf)
            $bmp.Save($path,[System.Drawing.Imaging.ImageFormat]::Png)
            $g.Dispose(); $bmp.Dispose()
          }
          New-Logo "$staging\Assets\StoreLogo.png" 50
          New-Logo "$staging\Assets\Square44x44Logo.png" 44
          New-Logo "$staging\Assets\Square150x150Logo.png" 150
          # بيانات الحزمة (تعمل بدون توقيع لتثبيت محلي بشهادة مطوّر).
          $manifest = @'
          <?xml version="1.0" encoding="utf-8"?>
          <Package xmlns="http://schemas.microsoft.com/appx/manifest/foundation/windows10"
                   xmlns:uap="http://schemas.microsoft.com/appx/manifest/uap/windows10">
            <Identity Name="Nexora.MudirAlHesabat" Version="1.0.0.0"
                      Publisher="CN=Nexora" ProcessorArchitecture="x64"/>
            <Properties>
              <DisplayName>مدير الحسابات</DisplayName>
              <PublisherDisplayName>Nexora</PublisherDisplayName>
              <Logo>Assets\StoreLogo.png</Logo>
            </Properties>
            <Dependencies>
              <TargetDeviceFamily Name="Windows.Desktop" MinVersion="10.0.17763.0"
                                  MaxVersionTested="10.0.22621.0"/>
            </Dependencies>
            <Resources><Resource Language="ar"/></Resources>
            <Applications>
              <Application Id="App" Executable="app\nexora_app.exe"
                           EntryPoint="Windows.FullTrustApplication">
                <uap:VisualElements DisplayName="مدير الحسابات"
                                    Description="مدير الحسابات"
                                    BackgroundColor="transparent"
                                    Square150x150Logo="Assets\Square150x150Logo.png"
                                    Square44x44Logo="Assets\Square44x44Logo.png"/>
              </Application>
            </Applications>
          </Package>
          '@
          Set-Content -Path "$staging\AppxManifest.xml" -Value $manifest -Encoding UTF8
          # بناء MSIX اختياري: أي فشل لا يُفشل سير العمل (النسخة المحمولة هي الأساس).
          try {
            $makeappx = (Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter makeappx.exe -ErrorAction SilentlyContinue | Select-Object -First 1).FullName
            if ($makeappx) {
              & $makeappx pack /d $staging /p nexora-windows.msix /o
              Write-Host "MSIX built OK"
            } else {
              Write-Host "makeappx غير موجود — تم تخطي MSIX"
            }
          } catch {
            Write-Host "تخطّي MSIX (غير حرج): $_"
          }

      - name: Write install/readme file
        shell: pwsh
        run: |
          $help = "مدير الحسابات — نسخة ويندوز`r`n`r`nالأسهل (نسخة محمولة، لا تحتاج تثبيت):`r`n1) استخرج nexora-windows.zip بالكامل إلى مجلد (لا تفرّق الملفات).`r`n2) انقر مرتين على Run.bat، أو افتح مجلد App وشغّل nexora_app.exe.`r`nملاحظة: لا تنقل nexora_app.exe خارج مجلد App (يحتاج ملفات data وDLL مجاورة).`r`nأول تشغيل قد يحذّرك SmartScreen: اضغط (مزيد من المعلومات) ثم (تشغيل على أي حال)."
          Set-Content -Path "README-install.txt" -Value $help -Encoding UTF8

      - name: Upload EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexora-windows
          path: build/windows/x64/runner/Release/*
          retention-days: 30

      - name: Preserve other-platform assets (android)
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          # لا نحذف ملفات الأندرويد: ننزّلها لتُعاد رفعها مع ملف ويندوز.
          for f in nexora-arm64.apk version.json; do
            code=$(curl -sL -o "$f" -w "%{http_code}" \
              "https://github.com/${{ github.repository }}/releases/download/latest/$f" || true)
            if [ "$code" != "200" ]; then echo "لا يوجد $f بعد — سيتخطاه الرفع"; rm -f "$f"; fi
          done
          ls -lh nexora-arm64.apk version.json 2>/dev/null || true

      - name: Update unified latest release (Windows)
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: latest
          name: Nexora — الإصدار الرسمي الأحدث
          body: |
            ## 📥 التحميل المباشر

            **هذا هو الإصدار الرسمي الأحدث من التطبيق.**

            ### 🖥️ لويندوز
            - حمّل ملف `nexora-windows.zip` بالأسفل.
            - فك الضغط في أي مجلد ثم شغّل `nexora_app.exe`.

            ### 📱 للأندرويد (APK)
            - يُرفع ملف الأندرويد تلقائيًا هنا بعد انتهاء بناء APK (قد يتأخر بضع دقائق).
            - ثبّت `nexora-arm64.apk` على الجهاز.

            > يتم تحديث هذه الصفحة تلقائيًا بعد كل بناء ناجح.
          files: |
            nexora-windows.zip
            nexora-windows.msix
            README-install.txt
            nexora-arm64.apk
            version.json
          fail_on_unmatched_files: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
