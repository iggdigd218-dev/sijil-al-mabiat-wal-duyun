name: Build Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Windows Desktop
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Generate fresh Windows platform (match installed Visual Studio)
        run: |
          Remove-Item -Recurse -Force windows -ErrorAction SilentlyContinue
          flutter create --platforms=windows --project-name nexora_app .

      - name: Analyze (non-blocking)
        run: flutter analyze || true

      - name: Diagnose toolchain
        run: |
          flutter doctor -v
          & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -all -property installationPath
          echo "---"
          cmake --version

      - name: Build Windows Release
        env:
          # إضافة local_auth_windows تُترجم بـ /await القديم (STL1011 خطأ في VS 2026).
          # لا نستخدم البصمة على ويندوز؛ نكتم التحذير القاتل حتى تُترجم الإضافة.
          CL: "/D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS"
        run: |
          flutter clean
          flutter pub get
          flutter build windows --release

      - name: Package ZIP
        shell: pwsh
        run: |
          $src = "build\windows\x64\runner\Release"
          $zip = "nexora-windows.zip"
          Compress-Archive -Path "$src\*" -DestinationPath $zip -Force
          echo "ZIP=$zip" >> $env:GITHUB_ENV

      - name: Upload EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexora-windows
          path: build/windows/x64/runner/Release/*
          retention-days: 30

      - name: Preserve other-platform assets (android)
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          # لا نحذف ملفات الأندرويد: ننزّلها لتُعاد رفعها مع ملف ويندوز.
          for f in nexora-arm64.apk version.json; do
            code=$(curl -sL -o "$f" -w "%{http_code}" \
              "https://github.com/${{ github.repository }}/releases/download/latest/$f" || true)
            if [ "$code" != "200" ]; then echo "لا يوجد $f بعد — سيتخطاه الرفع"; rm -f "$f"; fi
          done
          ls -lh nexora-arm64.apk version.json 2>/dev/null || true

      - name: Update unified latest release (Windows)
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: latest
          name: Nexora — الإصدار الرسمي الأحدث
          body: |
            ## 📥 التحميل المباشر

            **هذا هو الإصدار الرسمي الأحدث من التطبيق.**

            ### 🖥️ لويندوز
            - حمّل ملف `nexora-windows.zip` بالأسفل.
            - فك الضغط في أي مجلد ثم شغّل `nexora_app.exe`.

            ### 📱 للأندرويد (APK)
            - يُرفع ملف الأندرويد تلقائيًا هنا بعد انتهاء بناء APK (قد يتأخر بضع دقائق).
            - ثبّت `nexora-arm64.apk` على الجهاز.

            > يتم تحديث هذه الصفحة تلقائيًا بعد كل بناء ناجح.
          files: |
            nexora-windows.zip
            nexora-arm64.apk
            version.json
          fail_on_unmatched_files: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
