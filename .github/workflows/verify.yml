name: Verify (Analyze + Test)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Flutter quality gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - name: Get dependencies
        run: flutter pub get
      - name: Static analysis (blocking)
        run: flutter analyze --no-pub
      - name: Tests including release blockers (blocking)
        run: flutter test --no-pub --concurrency=1 --coverage
