name: Build License Admin APK

on:
  push:
    branches: [ main ]
    paths: [ 'admin_app/**' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Admin APK (arm64)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin_app
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.x'
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Build APK (arm64)
        run: |
          flutter build apk --release --target-platform android-arm64
          cp build/app/outputs/flutter-apk/app-release.apk ../license-admin.apk
          ls -lh ../license-admin.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: license-admin-apk
          path: license-admin.apk
          retention-days: 30

      - name: Attach to admin release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: admin-latest
          name: 🔑 مدير التراخيص — أحدث إصدار (للمالك فقط)
          body: |
            ## ⚠️ تطبيق خاص بمالك النظام فقط — لا يوزَّع للعملاء

            حمّل `license-admin.apk` وثبّته على هاتفك، ثم اضبط رابط
            قاعدة البيانات من ⚙️ داخل التطبيق.
          files: license-admin.apk
          fail_on_unmatched_files: true
          prerelease: false
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
